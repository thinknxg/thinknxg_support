[project]
name = "thinknxg_support"
authors = [{ name = "Kreatao", email = "support@thinknxg.com" }]
description = "thinkNXG Support - unified customer service portal for Frappe / ERPNext v16 (Helpdesk + Raven + ERPNext)"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"
