name: thinknxg_agent
description: thinkNXG Support Agent app for Windows, Android and iOS.
publish_to: none
version: 1.10.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ">=4.1.0 <7.0.0"
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  file_picker: ">=8.1.0 <11.0.0"
  open_filex: ^4.5.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  firebase_core: ">=3.6.0 <5.0.0"
  firebase_messaging: ">=15.1.0 <17.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
