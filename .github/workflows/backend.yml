name: Backend tests

on:
  push:
    paths: ["thinknxg_support/**", "pyproject.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["thinknxg_support/**", "pyproject.toml", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --select F,E9 thinknxg_support
      - run: python -m compileall -q thinknxg_support

  bench:
    name: Frappe v16 + ERPNext + Helpdesk
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install bench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libmariadb-dev mariadb-client wkhtmltopdf >/dev/null || true
          pip install frappe-bench
          npm install -g yarn
      - name: Init bench (Frappe v16)
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:13000
      - name: Get apps
        run: |
          cd ~/frappe-bench
          bench get-app --branch version-16 erpnext
          bench get-app helpdesk
          bench get-app thinknxg_support "$GITHUB_WORKSPACE/app"
      - name: Create site
        run: |
          cd ~/frappe-bench
          bench new-site test.localhost --db-root-password root --admin-password admin --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app helpdesk
          bench --site test.localhost install-app thinknxg_support
          bench --site test.localhost set-config allow_tests true
      - name: Run thinkNXG Support tests
        run: |
          cd ~/frappe-bench
          bench --site test.localhost run-tests --app thinknxg_support
