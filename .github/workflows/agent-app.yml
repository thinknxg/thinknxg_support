name: Agent app

on:
  push:
    paths: ["agent_app/**", ".github/workflows/agent-app.yml"]
  pull_request:
    paths: ["agent_app/**", ".github/workflows/agent-app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: agent_app
    shell: bash

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: bash tool/configure_platforms.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  android:
    name: Android test build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: thinknxg-agent-android-debug
          path: agent_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - run: flutter build windows --release
      - name: Sign (when a certificate is configured)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\windows\x64\runner\Release\thinknxg_agent.exe
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: thinknxg-agent-windows
          path: agent_app/build/windows/x64/runner/Release/

  ios:
    name: iOS build (no code signing)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - run: flutter build ios --release --no-codesign
