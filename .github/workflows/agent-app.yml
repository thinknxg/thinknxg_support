name: Agent app

on:
  push:
    paths: ["agent_app/**", ".github/workflows/agent-app.yml"]
  pull_request:
    paths: ["agent_app/**", ".github/workflows/agent-app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: agent_app
    shell: bash

env:
  # Push (Firebase) settings: empty values build an app without push; set these repository secrets to enable it.
  DART_DEFINES: >-
    --dart-define=FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
    --dart-define=FCM_API_KEY=${{ secrets.FCM_API_KEY }}
    --dart-define=FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID }}
    --dart-define=FCM_ANDROID_APP_ID=${{ secrets.FCM_ANDROID_APP_ID }}
    --dart-define=FCM_IOS_APP_ID=${{ secrets.FCM_IOS_APP_ID }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: bash tool/configure_platforms.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  android:
    name: Android (APK + App Bundle)
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - name: Release signing key (when configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release $DART_DEFINES
      - run: flutter build appbundle --release $DART_DEFINES
      - name: Note signing
        run: |
          if [ -f android/key.properties ]; then echo "Signed with the release key." >> $GITHUB_STEP_SUMMARY;
          else echo "Android: no release key configured; the APK/AAB are signed with the debug key (test builds only)." >> $GITHUB_STEP_SUMMARY; fi
      - uses: actions/upload-artifact@v4
        with:
          name: thinknxg-agent-android
          path: |
            agent_app/build/app/outputs/flutter-apk/app-release.apk
            agent_app/build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows (installer)
    needs: test
    runs-on: windows-latest
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - run: flutter build windows --release $DART_DEFINES
      - name: Version
        id: v
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> $GITHUB_OUTPUT
      - name: Sign the app (when a certificate is configured)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\windows\x64\runner\Release\thinknxg_agent.exe
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" installer\thinknxg_agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer (when a certificate is configured)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -First 1
          Get-ChildItem build\installer\*.exe | ForEach-Object { & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"
      - name: Note signing
        run: |
          if [ -n "$WINDOWS_CERT_BASE64" ]; then echo "Windows installer signed." >> $GITHUB_STEP_SUMMARY;
          else echo "Windows: no code-signing certificate configured; the installer is unsigned (SmartScreen will warn)." >> $GITHUB_STEP_SUMMARY; fi
      - uses: actions/upload-artifact@v4
        with:
          name: thinknxg-agent-windows-installer
          path: agent_app/build/installer/*.exe

  ios:
    name: iOS (TestFlight when signing is configured)
    needs: test
    runs-on: macos-latest
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/configure_platforms.sh
      - run: flutter build ios --config-only --no-codesign $DART_DEFINES
      - run: bash tool/configure_platforms.sh   # now that the Podfile exists: iOS 15 for Firebase
      - name: Unsigned build (no Apple signing configured)
        if: ${{ env.IOS_P12_BASE64 == '' }}
        run: |
          flutter build ios --release --no-codesign $DART_DEFINES
          echo "iOS: no Apple signing configured; built without code signing (cannot be installed)." >> $GITHUB_STEP_SUMMARY
      - name: Signed IPA
        if: ${{ env.IOS_P12_BASE64 != '' }}
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KC=$RUNNER_TEMP/agent.keychain-db; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KP" "$KC"
          echo "$IOS_P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"; security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/agent.mobileprovision
          UUID=$(security cms -D -i $RUNNER_TEMP/agent.mobileprovision | plutil -extract UUID raw -)
          cp $RUNNER_TEMP/agent.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          BUNDLE=$(security cms -D -i $RUNNER_TEMP/agent.mobileprovision | plutil -extract Entitlements.application-identifier raw - | cut -d. -f2-)
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$UUID</string></dict>
          </dict></plist>
          PLIST
          flutter build ipa --release --export-options-plist=$RUNNER_TEMP/ExportOptions.plist $DART_DEFINES
      - name: Upload to TestFlight (when App Store Connect is configured)
        if: ${{ env.IOS_P12_BASE64 != '' && env.ASC_KEY_ID != '' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: ${{ env.IOS_P12_BASE64 != '' }}
        with:
          name: thinknxg-agent-ios
          path: agent_app/build/ios/ipa/*.ipa
